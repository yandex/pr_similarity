# Select a source project; credentials stay in the operator environment.
env_file: ./.env
dataset:
  name: example-basket
  description: Example public GitHub PR basket
  maintainers:
  - your-github-login
output_dir: ./output
cache_dir: ./cache
collect:
  default_branch_only: true
  selection: change_ids
  change_ids:
  - 1
  max_changes: 10
filter:
  size:
    min_lines: 1
    max_lines: 10000
  files:
    enabled: true
    source_extensions:
    - .py
    - .go
    - .java
    - .js
    - .jsx
    - .ts
    - .tsx
    - .cpp
    - .cc
    - .c
    - .h
    - .hpp
    - .rs
    - .rb
    min_source_proportion: 0.5
    forbidden_path_patterns:
    - (^|/)(docs?|documentation)/
    - (^|/)(README|CHANGELOG)(\.[^/]+)?$
  issues:
    allow_no_issue: false
    allow_multiple_issues: false
  selection:
    shuffle: false
    limit: 10
generation:
  source: issue
export:
  include_golden_diff: false
schema_version: 1
source:
  provider: github
  project: owner/repo
  token_env: GITHUB_TOKEN
