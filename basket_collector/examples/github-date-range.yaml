schema_version: 2
# Collect a fixed month, filter locally, then generate at most five tasks.
# Repository: https://github.com/pallets/werkzeug
env_file: ../.env
dataset:
  name: werkzeug-april-2026
  description: Seeded sample of small Python changes merged in April 2026
  maintainers: [your-github-login]
output_dir: ../output/examples/github-date-range
cache_dir: ../cache/examples/github-date-range
source:
  provider: github
  project: pallets/werkzeug
  request_timeout_seconds: 30
  requests_per_second: 1
  max_pages: 100
collect:
  selection: date_range
  # Half-open UTC interval: includes merged_from, excludes merged_before.
  merged_from: '2026-04-01T00:00:00Z'
  merged_before: '2026-05-01T00:00:00Z'
  default_branch_only: true
  max_changes: 20
filter:
  workers: 2
  size:
    min_lines: 5
    max_lines: 500
    max_chars: 50000
    max_files: 8
  files:
    enabled: true
    source_extensions: [.py]
    min_source_proportion: 0.5
    # Allowed patterns apply to EVERY changed file; required ones need ONE match.
    allowed_path_patterns: ['^src/werkzeug/', '^tests/', '^CHANGES\.rst$']
    required_path_patterns: ['^src/werkzeug/']
    forbidden_path_patterns: ['(^|/)(docs?|\.github)/']
  issues:
    allow_no_issue: true
    allow_multiple_issues: true
  percentile:
    enabled: true
    metric: changed_lines
    # Tail counts round down: fewer than 10 survivors means no trimming.
    lower_fraction: 0.1
    upper_fraction: 0.1
  selection:
    shuffle: true
    seed: 202604
    limit: 5
generation:
  source: llm
  context: diff
  workers: 2
  requests_per_second: 1
  request_timeout_seconds: 120
  max_retries: 2
  max_input_chars: 60000
  templates:
    system: ../prompts/system.jinja2
    user: ../prompts/diff.jinja2
  llm:
    api: openai_completions
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1-mini
    parameters:
      temperature: 0.2
      max_output_tokens: 4096
export:
  # The golden diff is exported for inspection; it is not part of agent_task.
  include_golden_diff: true
