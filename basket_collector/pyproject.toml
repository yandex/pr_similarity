[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-similarity-os-basket-collector"
version = "0.3.1"
description = "Collect frozen benchmark baskets from GitHub and GitLab changes."
readme = "README.md"
license = "Apache-2.0"
license-files = []
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "httpx>=0.28,<1",
    "Jinja2>=3.1,<4",
    "python-dotenv>=1,<2",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.25,<5", "pytest>=8,<9", "setuptools>=75,<100", "wheel>=0.44,<1"]

[tool.setuptools]
packages = ["basket_collector", "basket_collector.models", "basket_collector.providers", "basket_collector.vcs", "basket_collector.persistence", "basket_collector.runtime", "basket_collector.stages"]
package-dir = {"basket_collector" = "src"}

[tool.setuptools.package-data]
basket_collector = ["schemas/*.json", "requirements.lock"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = true

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
