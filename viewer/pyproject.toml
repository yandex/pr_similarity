[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-similarity-os-viewer"
version = "0.3.1"
description = "Standalone anonymous viewer and owner API for PR Similarity benchmark runs."
readme = "README.md"
license = "Apache-2.0"
license-files = []
requires-python = ">=3.12"
dependencies = ["starlette>=0.47,<1", "uvicorn>=0.35,<1", "boto3>=1.40,<2", "jsonschema>=4.25,<5", "pydantic>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "build>=1,<2", "playwright>=1.55,<2"]

[project.scripts]
prsim-viewer = "viewer.cli:main"

[tool.setuptools]
packages = ["viewer", "viewer.models", "viewer.validation", "viewer.presentation", "viewer.web", "viewer.persistence"]
package-dir = {viewer = "src"}

[tool.setuptools.package-data]
viewer = ["schemas/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
