# OpenAI agent customized with the vendored Superpowers TDD skill.
# Set OPENAI_API_KEY and choose a model available to your account.
schema_version: 1
workers: 1
agent:
  name: openai-tdd
  runtime: opencode:v1.18.33
  auth:
    mode: api_key
  config:
    opencode_json:
      model: openai/gpt-5.6-sol
      permission:
        '*': allow
      provider:
        openai:
          npm: '@ai-sdk/openai'
          options:
            apiKey: '{env:OPENAI_API_KEY}'
          models:
            gpt-5.6-sol:
              options:
                reasoningEffort: medium
      skills:
        paths:
          - ./skills/test-driven-development
      instructions:
        - ./agent-tdd.md
  timeout_seconds: 1800
  retries:
    max_retries: 1
    categories: []
  credentials:
    OPENAI_API_KEY: OPENAI_API_KEY
