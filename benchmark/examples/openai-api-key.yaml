# Set OPENAI_API_KEY in benchmark/.env or your environment.
# Select a model available to your API account before running.
schema_version: 1
workers: 1
agent:
  name: openai-api-key
  runtime: opencode:v1.18.33
  auth:
    mode: api_key
  config:
    opencode_json:
      model: openai/gpt-5.6-sol
      permission:
        '*': allow
      provider:
        openai:
          npm: '@ai-sdk/openai'
          options:
            apiKey: '{env:OPENAI_API_KEY}'
          models:
            gpt-5.6-sol:
              options:
                reasoningEffort: medium
  timeout_seconds: 1800
  retries:
    max_retries: 1
    categories: []
  credentials:
    OPENAI_API_KEY: OPENAI_API_KEY
