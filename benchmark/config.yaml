schema_version: 1
workers: 4

agent:
  name: baseline
  auth:
    mode: api_key
    profile: null
    refresh_timeout_seconds: 30
    expiry_margin_seconds: 60
  runtime: opencode:v1.18.33
  config:
    opencode_json:
      model: example/model
  timeout_seconds: 1800
  setup: null
  instructions_file: null
  retries:
    max_retries: 2
    categories: [timeout_no_changes]
  diff_excludes: []
  env: {}
  credentials:
    OPENAI_API_KEY: OPENAI_API_KEY

sandbox:
  backend: bubblewrap
  executable: bwrap
  auto_install: true

shutdown:
  grace_seconds: 10

provisioning:
  cache_dir: ~/.cache/prsimbm
  download_timeout_seconds: 120

git:
  timeout_seconds: 120
  initial_depth: 1
  max_depth: 4096
  max_transfer_bytes: 536870912
